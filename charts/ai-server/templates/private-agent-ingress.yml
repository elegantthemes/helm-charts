{{- if .Values.WEB_CAPTURES_ROUTE_PRIVACY_ENABLED }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-private-agent
  namespace: {{ .Release.Namespace }}
  annotations:
    # These paths carry opaque capture IDs or URL-reference generation. Audit
    # the route template in AI Server; do not retain raw paths or auth headers.
    traefik.ingress.kubernetes.io/router.observability.accesslogs: "false"
    traefik.ingress.kubernetes.io/router.observability.tracing: "false"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
{{- if .Values.INGRESS_CLASS_NAME }}
  ingressClassName: {{ .Values.INGRESS_CLASS_NAME }}
{{- end }}
  tls:
    - hosts:
        - {{ .Values.VIRTUAL_HOST }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.VIRTUAL_HOST }}
      http:
        paths:
{{- range list "/api/v2/agent/web-captures" "/api/v2/agent/generate-layout" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
{{- if $.Values.MAINTENANCE_MODE }}
                name: {{ $.Release.Name }}-maintenance
                port:
                  number: 80
{{- else }}
                name: {{ $.Release.Name }}
                port:
                  number: 9999
{{- end }}
{{- end }}
{{- end }}
