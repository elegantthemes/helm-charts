# Default values for percona-xtradb-cluster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

cluster_name:
label_name:
label_value:
pxc_expose:
replication_channels: []
update_strategy: RollingUpdate
s3_bucket_name_backup_aws_1:
s3_bucket_name_backup_2:
s3_bucket_name_backup_3:
s3_bucket_name_backup_4:
s3_endpoint_backup_aws_1:
s3_endpoint_backup_2:
s3_endpoint_backup_3:
s3_endpoint_backup_4:
s3_region_backup_aws_1:
s3_region_backup_2:
s3_region_backup_3:
s3_region_backup_4:
s3_secret_name_backup_aws_1:
s3_secret_name_backup_2:
s3_secret_name_backup_3:
s3_secret_name_backup_4:
s3_bucket_name_backup_pitr_1:
s3_endpoint_backup_pitr_1:
s3_region_backup_pitr_1:
s3_secret_name_backup_pitr_1:
secrets_name:
ssl_internal_secrets_name:
ssl_secrets_name:
storage_class_name:
vault_secrets_name:
pxc:
  image: percona/percona-xtradb-cluster:8.0.45-36.1
  resources:
    requests:
      memory: 1G
      cpu: 500m
    limits:
      memory: 8G
      cpu: 6000m
  innodb_redo_log_capacity: "104857600"
  mysql_configuration: []
pitr:
  enabled: true
  resources: {}
backup:
  image: percona/percona-xtrabackup:8.0.35-35.1
  schedule:
    # At minute 1 past every 12th hour from 6 through 23.
    - name: aws
      schedule: "1 6/12 * * *"
      keep: 60
      storageName: backup-aws-1
  ttlSecondsAfterFinished: 3600
pmm:
  enabled: false
  image: percona/pmm-client:3.8.0
  serverHost: monitoring-service
  serverUser: admin
backup_replication:
  enabled:
  schedule:
  image:
  resources:
    requests:
      cpu:
      memory:
    limits:
      cpu:
      memory:
