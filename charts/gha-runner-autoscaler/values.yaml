affinity: {}
clusterRoleName: gha-runner-autoscaler
configMapName: gha-runner-autoscaler
dryRun: true
image: elegantthemes/gha-runner-autoscaler:26.7.15
imageVersion: 0.1.2
secretName: gha-runner-autoscaler

# Install-only bootstrap; existing state stays application-owned.
# Empty selects <release>-provisioning-state. Keep this identity stable per pool.
provisioningStateConfigMapName: ""
workerCapacityConfigMapName: ""

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

scaleDownEnabled: false

monitoring:
  enabled: false
  clusterName: unknown
  scrapeInterval: 30s
  manualReviewAlertFor: 5m
  arcListenerAlertFor: 2m
  capacityDeficitAlertFor: 3m
  creationRetriesAlertFor: 1m
  inventoryUntrustedAlertFor: 2m
  unscheduledJobsAlertFor: 5m
  recoveryRunbookUrl: https://github.com/elegantthemes/gha-runner-autoscaler#recovery-alerts
  # Shared-controller pools reuse the controller namespace and scrape target.
  arcEnabled: true # Enable ARC scraping and listener alerts for runner pools.
  arcControllerMonitoringEnabled: true
  arcControllerNamespace: ""
  arcRunnerScaleSetName: et-runners
  arcControllerReleaseName: et-runners
  arcRunbookUrl: https://github.com/elegantthemes/terraform/blob/master/apps/gha-runners/README.md#arc-listener-alert
  runbookUrl: https://github.com/elegantthemes/gha-runner-autoscaler#manual-review-alert
