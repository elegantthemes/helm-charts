{{- $appKey := required "APP_KEY must be set for hub-server" .Values.APP_KEY }}
{{- if not (regexMatch "^base64:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$" $appKey) }}
{{- fail "APP_KEY must be the unchanged canonical base64-encoded 32-byte Laravel key; unsupported formats require separate review" }}
{{- end }}
{{- $environment := dict
  "API_EXPECTED_REQUEST_SECRET" (.Values.API_EXPECTED_REQUEST_SECRET)
  "APP_KEY" ($appKey)
  "APP_ENV" (.Values.HUB_SERVER_ENV)
  "APP_URL" (printf "https://%s" .Values.VIRTUAL_HOST)
  "CLOUDFLARE_BYPASS_KEY" (.Values.CLOUDFLARE_BYPASS_KEY)
  "DASH_EXPECTED_REQUEST_SECRET" (.Values.DASH_EXPECTED_REQUEST_SECRET)
  "DIVI_HUB_API_LIVE_SERVER" (printf "https://%s" .Values.VIRTUAL_HOST)
  "DIVI_HUB_POD_COUNT" (.Values.DIVI_HUB_POD_COUNT)
  "DIVI_HUB_WEBSITES_QUEUE_SIZE" (.Values.DIVI_HUB_WEBSITES_QUEUE_SIZE)
  "DIVI_HUB_IP_ADDRESS" (.Values.DIVI_HUB_IP_ADDRESS)
  "DIVI_HUB_PRIVATE_KEY_64" (.Values.DIVI_HUB_PRIVATE_KEY_64 | default "" | b64enc)
  "DIVI_HUB_SERVER_URL" (.Values.DIVI_HUB_SERVER_URL)
  "DIVI_METRICS_ENDPOINT_ENABLED" (.Values.DIVI_METRICS_ENDPOINT_ENABLED)
  "DIVI_METRICS_ENDPOINT_TOKEN" (.Values.DIVI_METRICS_ENDPOINT_TOKEN)
  "HORIZON_ALLOWED_IPS" (.Values.HORIZON_ALLOWED_IPS)
  "HUB_SERVER_PATH" (.Values.HUB_SERVER_PATH)
  "HUB_SERVER_REPO_URL" (.Values.HUB_SERVER_REPO_URL)
  "IMAGE_VERSION" (.Values.HUB_SERVER_VERSION)
  "JWT_AUTH_PUBLIC_KEY" (.Values.JWT_AUTH_PUBLIC_KEY)
  "LOG_LEVEL" (.Values.LOG_LEVEL)
  "REDIS_HOST" (.Values.REDIS_HOSTNAME)
  "REDIS_SENTINEL_HOST" (.Values.REDIS_HOSTNAME)
  "REDIS_SENTINEL_SERVICE" (.Values.REDIS_SENTINEL_SERVICE)
  "VIRTUAL_HOST" (.Values.VIRTUAL_HOST)
-}}
{{- $allowed := list "API_EXPECTED_REQUEST_SECRET" "CLOUDFLARE_BYPASS_KEY" "DASH_EXPECTED_REQUEST_SECRET" "DIVI_HUB_IP_ADDRESS" "DIVI_HUB_PRIVATE_KEY_64" "DIVI_HUB_SERVER_URL" "DIVI_HUB_POD_COUNT" "DIVI_HUB_WEBSITES_QUEUE_SIZE" "DIVI_METRICS_ENDPOINT_ENABLED" "DIVI_METRICS_ENDPOINT_TOKEN" "HORIZON_ALLOWED_IPS" "JWT_AUTH_PUBLIC_KEY" "LOG_LEVEL" "REDIS_HOST" "REDIS_SENTINEL_HOST" "REDIS_SENTINEL_SERVICE" "APP_PREVIOUS_KEYS" "APP_DEBUG" "OUTBOUND_ENFORCE_RETURNED_LOGIN_URL_HOST" "OUTBOUND_URL_ALLOWED_HOSTNAMES" "OUTBOUND_DNS_CACHE_TTL_SECONDS" "JWT_VERIFICATION_BYPASS_TTL_SECONDS" "QUEUE_LEGACY_DEDUPLICATION_UNTIL" "ACL_CLEANUP_DRY_RUN" "DIVI_HUB_API_REQUEST_TIMEOUT_SECONDS" "DIVI_HUB_SUSPENDED_QUEUE_TIMEOUT_SECONDS" }}
{{- range $key, $value := .Values.HUB_SERVER_EXTRA_ENV }}
{{- if not (kindIs "string" $value) }}
{{- fail "HUB_SERVER_EXTRA_ENV values must be strings" }}
{{- end }}
{{- if or (not (has $key $allowed)) (regexMatch "['\\r\\n]" (toString $value)) }}
{{- fail "Invalid HUB_SERVER_EXTRA_ENV entry: use the explicit application allowlist; shell controls, paths, metadata, single quotes and line breaks are forbidden" }}
{{- end }}
{{- $_ := set $environment $key $value }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: secrets
  namespace: {{ .Release.Namespace }}
stringData:
  DIVI_METRICS_ENDPOINT_TOKEN: {{ index $environment "DIVI_METRICS_ENDPOINT_TOKEN" | squote }}
  GITHUB_TOKEN: {{ .Values.GITHUB_TOKEN | squote }}
  .env: |
{{- range $key, $value := $environment }}
    {{ $key }}={{ $value | squote }}
{{- end }}
