apiVersion: v1
kind: Secret
metadata:
  name: secrets
  namespace: {{ .Release.Namespace }}
stringData:
  DIVI_METRICS_ENDPOINT_TOKEN: {{ .Values.DIVI_METRICS_ENDPOINT_TOKEN | squote }}
  GITHUB_TOKEN: {{ .Values.GITHUB_TOKEN | squote }}
  .env: |
    API_EXPECTED_REQUEST_SECRET={{ .Values.API_EXPECTED_REQUEST_SECRET | squote }}
    APP_KEY={{ required "APP_KEY must be set for hub-server" .Values.APP_KEY | squote }}
    APP_ENV={{ .Values.HUB_SERVER_ENV | squote }}
    APP_URL='https://{{ .Values.VIRTUAL_HOST }}'
    CLOUDFLARE_BYPASS_KEY={{ .Values.CLOUDFLARE_BYPASS_KEY | squote }}
    DASH_EXPECTED_REQUEST_SECRET={{ .Values.DASH_EXPECTED_REQUEST_SECRET | squote }}
    DIVI_HUB_API_LIVE_SERVER='https://{{ .Values.VIRTUAL_HOST }}'
    DIVI_HUB_POD_COUNT={{ .Values.DIVI_HUB_POD_COUNT | squote }}
    DIVI_HUB_WEBSITES_QUEUE_SIZE={{ .Values.DIVI_HUB_WEBSITES_QUEUE_SIZE | squote }}
    DIVI_HUB_IP_ADDRESS={{ .Values.DIVI_HUB_IP_ADDRESS | squote }}
    DIVI_HUB_PRIVATE_KEY_64={{ .Values.DIVI_HUB_PRIVATE_KEY_64 | b64enc | squote }}
    DIVI_HUB_SERVER_URL={{ .Values.DIVI_HUB_SERVER_URL | squote }}
    DIVI_METRICS_ENDPOINT_ENABLED={{ .Values.DIVI_METRICS_ENDPOINT_ENABLED | squote }}
    DIVI_METRICS_ENDPOINT_TOKEN={{ .Values.DIVI_METRICS_ENDPOINT_TOKEN | squote }}
    HORIZON_ALLOWED_IPS={{ .Values.HORIZON_ALLOWED_IPS | squote }}
    HUB_SERVER_PATH={{ .Values.HUB_SERVER_PATH | squote }}
    HUB_SERVER_REPO_URL={{ .Values.HUB_SERVER_REPO_URL | squote }}
    IMAGE_VERSION={{ .Values.HUB_SERVER_VERSION | squote }}
    JWT_AUTH_PUBLIC_KEY={{ .Values.JWT_AUTH_PUBLIC_KEY | squote }}
    LOG_LEVEL={{ .Values.LOG_LEVEL | squote }}
    REDIS_HOST={{ .Values.REDIS_HOSTNAME | squote }}
    REDIS_SENTINEL_HOST={{ .Values.REDIS_HOSTNAME | squote }}
    REDIS_SENTINEL_SERVICE={{ .Values.REDIS_SENTINEL_SERVICE | squote }}
    VIRTUAL_HOST={{ .Values.VIRTUAL_HOST | squote }}
{{- $allowed := list "APP_PREVIOUS_KEYS" "APP_DEBUG" "OUTBOUND_ENFORCE_RETURNED_LOGIN_URL_HOST" "OUTBOUND_URL_ALLOWED_HOSTNAMES" "OUTBOUND_DNS_CACHE_TTL_SECONDS" "JWT_VERIFICATION_BYPASS_TTL_SECONDS" "QUEUE_LEGACY_DEDUPLICATION_UNTIL" "ACL_CLEANUP_DRY_RUN" "DIVI_HUB_API_REQUEST_TIMEOUT_SECONDS" "DIVI_HUB_SUSPENDED_QUEUE_TIMEOUT_SECONDS" }}
{{- range $key, $value := .Values.HUB_SERVER_EXTRA_ENV }}
{{- if not (has $key $allowed) }}
{{- fail (printf "HUB_SERVER_EXTRA_ENV contains unsupported key %s" $key) }}
{{- end }}
{{- if not (kindIs "string" $value) }}
{{- fail (printf "HUB_SERVER_EXTRA_ENV.%s must be a string" $key) }}
{{- end }}
{{- if regexMatch "['\\r\\n]" $value }}
{{- fail (printf "HUB_SERVER_EXTRA_ENV.%s contains an unsupported quote or newline" $key) }}
{{- end }}
    {{ $key }}={{ $value | squote }}
{{- end }}
