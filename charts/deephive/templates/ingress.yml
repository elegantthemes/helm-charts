{{- $intakeCutover := and .Values.INTAKE_ENABLED .Values.INTAKE_CUTOVER }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: {{ .Values.INGRESS_CLASS_NAME | quote }}
  tls:
    - hosts:
        - {{ .Values.VIRTUAL_HOST }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.VIRTUAL_HOST }}
      http:
        paths:
{{- if $intakeCutover }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-consumer
                port:
                  number: {{ .Values.PORT }}
          - path: /graph
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-consumer
                port:
                  number: {{ .Values.PORT }}
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-consumer
                port:
                  number: {{ .Values.PORT }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-consumer
                port:
                  number: {{ .Values.PORT }}
{{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.PORT }}
