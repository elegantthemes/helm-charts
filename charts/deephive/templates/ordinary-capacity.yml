{{- $f := .Values.fullEnvironment }}
{{- $c := $f.ordinaryCapacity }}
{{- if $c.enabled }}
{{- if not $f.enabled }}{{ fail "Ordinary capacity requires fullEnvironment.enabled" }}{{ end }}
{{- if or (not ($c.pool | trim)) (not (hasPrefix "/" $f.ordinaryScratchRoot)) (eq $f.ordinaryScratchRoot "/") }}{{ fail "Ordinary capacity requires a stable pool and absolute scratch root" }}{{ end }}
{{- if or (le (int $c.slots) 0) (le (int $c.memoryMiB) 0) (le (int $c.taskMiB) 0) (gt (int $c.taskMiB) (int $c.memoryMiB)) }}{{ fail "Ordinary capacity requires positive slot and memory budgets" }}{{ end }}
{{- if or $f.ordinaryAdmissionCommand $f.ordinaryHandoffCommand }}{{ fail "Choose built-in ordinary capacity or external hooks, not both" }}{{ end }}
{{- $scratch := $f.ordinaryScratchRoot }}
{{- $source := .Values.WORKSPACE_ROOT }}
{{- if or (not $source) (eq $scratch $source) (ne (clean $scratch) $scratch) (hasPrefix (printf "%s/" $source) $scratch) (hasPrefix (printf "%s/" $scratch) $source) }}{{ fail "Ordinary scratch must be canonical and outside source" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ordinary-capacity
data:
  capacity.json: |
    {{ dict "pool" $c.pool "workspaceRoot" .Values.WORKSPACE_ROOT "slots" $c.slots "memoryMiB" $c.memoryMiB "taskMiB" $c.taskMiB | toJson }}
{{- end }}
