{{- include "deephive.normalizeWorkerValues" . -}}
{{- if .Values.fullWorker.enabled }}
{{- $f := .Values.fullWorker }}
{{- $github := $f.githubSecretRef | default dict }}
{{- $identity := printf "%s-%s-session-admission" .Release.Namespace .Release.Name }}
{{- $name := printf "%s-%s" ($identity | trunc 50 | trimSuffix "-") ((list .Release.Namespace .Release.Name "session-admission") | toJson | sha256sum | trunc 12) }}
{{- $images := concat (list $f.sessionImage) ($f.compatibleSessionImages | default list) }}
{{- range $image := $images }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) }}{{ fail "Compatible session images must pin a digest" }}{{ end }}
{{- end }}
{{- $secrets := list $f.agentSecret }}
{{- if $f.integrationSecret }}{{- $secrets = append $secrets $f.integrationSecret }}{{- end }}
# RBAC alone cannot restrict a Pod creator's Secret/hostPath access. This policy
# applies to the runner identity, even when it omits or forges workload labels.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [pods]
  matchConditions:
    - name: runner-identity
      expression: {{ printf "request.userInfo.username in ['system:serviceaccount:%s:%s', 'system:serviceaccount:%s:%s-runner']" .Release.Namespace (include "deephive.fullWorkerName" .) .Release.Namespace .Release.Name | quote }}
    {{- if ge (int $f.sessionProtocol) 4 }}
    - name: protocol-4-v1
      expression: "true"
    {{- end }}
  variables:
    - name: pod
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: containers
      expression: "variables.pod.spec.containers + (has(variables.pod.spec.initContainers) ? variables.pod.spec.initContainers : [])"
  validations:
    # Require session identity; extra metadata (including API-added topology)
    # must not impersonate the chart's worker, reader, Redis or DNS selectors.
    - expression: >-
        variables.pod.metadata.namespace == {{ .Release.Namespace | quote }} &&
        variables.pod.metadata.name.matches('^dh-[a-f0-9]{40}$') &&
        has(variables.pod.metadata.labels) &&
        variables.pod.metadata.labels['app.kubernetes.io/name'] == 'deephive-session' &&
        variables.pod.metadata.labels['app.kubernetes.io/instance'] == {{ .Release.Name | quote }} &&
        variables.pod.metadata.labels['deephive/session'] == variables.pod.metadata.name &&
        (!('deephive/worker-mode' in variables.pod.metadata.labels) || variables.pod.metadata.labels['deephive/worker-mode'] == 'full') &&
        variables.pod.metadata.labels.all(k, !(k in ['app', 'release', 'redis-client', 'k8s-app', 'deephive/role', 'deephive/source-reader']))
      message: Runner access is limited to task session pods, without privileged workload labels.
    - expression: >-
        request.operation != 'UPDATE' || (
          object.spec == oldObject.spec && has(oldObject.metadata.labels) &&
          oldObject.metadata.labels['app.kubernetes.io/instance'] == {{ .Release.Name | quote }})
      message: The runner may update its own termination metadata, not adopt another release or replace a live pod specification.
    # CREATE-only pins must not prevent cleanup/adoption of an older approved
    # image after a compatible runner/chart upgrade.
    - expression: >-
        request.operation != 'CREATE' || (
          {{- if ge (int $f.sessionProtocol) 4 }}
          has(variables.pod.metadata.annotations) &&
          variables.pod.metadata.annotations['deephive/protocol'] == '4' &&
          (!has(variables.pod.spec.nodeName) || variables.pod.spec.nodeName == '') &&
          variables.pod.spec.nodeSelector['deephive-full'] == 'true' &&
          has(variables.pod.spec.tolerations) &&
          variables.pod.spec.tolerations.exists(t, t.key == 'deephive-full' &&
            t.operator == 'Equal' && t.value == 'true' && t.effect == 'NoSchedule') &&
          has(variables.pod.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) &&
          variables.pod.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.exists(t,
            t.topologyKey == 'kubernetes.io/hostname' &&
            has(t.namespaceSelector) &&
            (!has(t.namespaceSelector.matchLabels) || size(t.namespaceSelector.matchLabels) == 0) &&
            (!has(t.namespaceSelector.matchExpressions) || size(t.namespaceSelector.matchExpressions) == 0) &&
            (!has(t.matchLabelKeys) || size(t.matchLabelKeys) == 0) &&
            (!has(t.mismatchLabelKeys) || size(t.mismatchLabelKeys) == 0) &&
            has(t.labelSelector.matchLabels) && size(t.labelSelector.matchLabels) == 1 &&
            t.labelSelector.matchLabels['app.kubernetes.io/name'] == 'deephive-session' &&
            (!has(t.labelSelector.matchExpressions) || size(t.labelSelector.matchExpressions) == 0)) &&
          variables.pod.metadata.labels['deephive/pool'] == 'deephive' &&
          !has(variables.pod.spec.securityContext.fsGroup) &&
          {{- else }}
          variables.pod.metadata.annotations['deephive/protocol'] in ['2', '3'] &&
          variables.pod.spec.nodeName == {{ $f.nodeName | quote }} &&
          {{- end }}
          variables.pod.spec.serviceAccountName == 'default' &&
          has(variables.pod.spec.automountServiceAccountToken) && !variables.pod.spec.automountServiceAccountToken &&
          (!has(variables.pod.spec.hostNetwork) || !variables.pod.spec.hostNetwork) &&
          (!has(variables.pod.spec.hostPID) || !variables.pod.spec.hostPID) &&
          (!has(variables.pod.spec.hostIPC) || !variables.pod.spec.hostIPC) &&
          variables.pod.spec.restartPolicy == 'Never'
        )
      message: Sessions must use the Full worker node and have no host namespaces or API token.
    - expression: >-
        request.operation != 'CREATE' || (
          variables.pod.spec.volumes.all(v,
            (has(v.emptyDir) && !has(v.persistentVolumeClaim)) ||
            (v.name == 'source' && variables.pod.metadata.annotations['deephive/protocol'] != '4' && has(v.persistentVolumeClaim) &&
             v.persistentVolumeClaim.claimName == {{ $f.workspaceClaim | quote }})) &&
          variables.containers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
            m.name != 'source' ||
            (variables.pod.metadata.annotations['deephive/protocol'] == '4' ?
              (c.name == 'session' && m.mountPath == '/workspace' && !has(m.subPath) && !has(m.subPathExpr)) :
              (has(m.subPath) && m.subPath != '' && !m.subPath.startsWith('/') &&
               m.subPath.split('/').all(p, p != '' && p != '.' && p != '..') && !has(m.subPathExpr)))))
        )
      message: Full protocol 4 source must be local; older sessions retain task subpaths of the workspace claim.
    - expression: >-
        request.operation != 'CREATE' || (
          variables.pod.spec.volumes.all(v, !has(v.emptyDir) || (
            (v.name in ['dependencies', 'scratch', 'database-run', 'database', 'evidence', 'shm'] ||
             (v.name == 'source' && variables.pod.metadata.annotations['deephive/protocol'] == '4')) &&
            has(v.emptyDir.sizeLimit) &&
            v.emptyDir.sizeLimit == {'source': '45Gi', 'dependencies': '30Gi', 'scratch': '5Gi', 'database-run': '16Mi', 'database': '5Gi', 'evidence': '5Gi', 'shm': '1Gi'}[v.name] &&
            (v.name == 'shm' ? (has(v.emptyDir.medium) && v.emptyDir.medium == 'Memory') :
              (!has(v.emptyDir.medium) || v.emptyDir.medium == '')))) &&
          variables.containers.all(c,
            c.name in ['session', 'database', 'local-mounts', 'activation-wait'] &&
            has(c.resources) && has(c.resources.limits) &&
            'memory' in c.resources.limits && 'ephemeral-storage' in c.resources.limits && 'cpu' in c.resources.limits &&
            c.resources.limits['cpu'] == {'session': '12', 'database': '1', 'local-mounts': '1', 'activation-wait': '1'}[c.name] &&
            c.resources.limits['memory'] == {'session': '16Gi', 'database': '1Gi', 'local-mounts': '256Mi', 'activation-wait': '256Mi'}[c.name] &&
            c.resources.limits['ephemeral-storage'] == {'session': '45Gi', 'database': '5Gi', 'local-mounts': '30Gi', 'activation-wait': '30Gi'}[c.name])
        )
      message: Sessions must retain the prepared recipe's bounded memory and local scratch resources.
    - expression: >-
        request.operation != 'CREATE' || variables.containers.all(c,
          (!has(c.envFrom) || size(c.envFrom) == 0) &&
          (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            ((e.valueFrom.secretKeyRef.name in {{ toJson $secrets }} &&
              e.valueFrom.secretKeyRef.key in ['OPENAI_API_KEY', 'ET_USERNAME', 'ET_API_KEY', 'ET_PASSWORD', 'GITHUB_TOKEN']) ||
             (c.name == 'session' && e.name == 'GITHUB_TOKEN' &&
              e.valueFrom.secretKeyRef.name == {{ ($github.name | default "") | quote }} &&
              e.valueFrom.secretKeyRef.key == {{ ($github.key | default "") | quote }})))) &&
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          has(c.securityContext.capabilities) && 'ALL' in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(cap,
            cap in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID', 'KILL'])) &&
          (!has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)))
      message: Sessions cannot inherit controller Secrets, escalate privileges or expose host ports.
    - expression: >-
        request.operation != 'CREATE' || (
          size(variables.pod.spec.containers) == 2 &&
          variables.pod.spec.containers.all(c,
            (c.name == 'session' && c.image in {{ toJson $images }}) ||
            (c.name == 'database' && c.image == {{ $f.databaseImage | quote }})) &&
          has(variables.pod.spec.initContainers) &&
          {{- if ge (int $f.sessionProtocol) 4 }}
          size(variables.pod.spec.initContainers) == 2 &&
          variables.pod.spec.initContainers[0].name == 'activation-wait' &&
          variables.pod.spec.initContainers[0].command == ['node', '-e', {{ .Files.Get "files/activation-wait.js" | toJson }}] &&
          (!has(variables.pod.spec.initContainers[0].args) || size(variables.pod.spec.initContainers[0].args) == 0) &&
          (!has(variables.pod.spec.initContainers[0].volumeMounts) || size(variables.pod.spec.initContainers[0].volumeMounts) == 0) &&
          variables.pod.spec.initContainers[1].name == 'local-mounts' &&
          variables.containers.all(c, !has(c.lifecycle) && !has(c.restartPolicy) && has(c.command) && size(c.command) > 0) &&
          variables.pod.spec.initContainers[0].env.size() == 6 &&
          variables.pod.spec.initContainers[0].env.all(e,
            (e.name == 'POD_UID' && has(e.valueFrom) && has(e.valueFrom.fieldRef) && e.valueFrom.fieldRef.fieldPath == 'metadata.uid') ||
            (has(e.value) && !has(e.valueFrom) && (
              (e.name == 'SESSION_ID' && e.value == variables.pod.metadata.name) ||
              (e.name == 'EXECUTION_GENERATION' && e.value == variables.pod.metadata.annotations['deephive/execution-generation']) ||
              (e.name == 'SESSION_RUNNER_URL' && e.value == {{ printf "http://%s:3001" (include "deephive.fullWorkerName" .) | quote }}) ||
              (e.name in ['SESSION_TOKEN', 'SESSION_STARTUP_DEADLINE'] && e.value != '')))) &&
          ['POD_UID', 'SESSION_ID', 'EXECUTION_GENERATION', 'SESSION_RUNNER_URL', 'SESSION_TOKEN', 'SESSION_STARTUP_DEADLINE'].all(n,
            variables.pod.spec.initContainers[0].env.filter(e, e.name == n).size() == 1) &&
          variables.pod.spec.initContainers.all(c, c.image in {{ toJson $images }})
          {{- else }}
          size(variables.pod.spec.initContainers) == 1 &&
          variables.pod.spec.initContainers.all(c, c.name == 'local-mounts' && c.image in {{ toJson $images }})
          {{- end }}
        )
      message: Only the approved session, database and mount-init images are permitted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
