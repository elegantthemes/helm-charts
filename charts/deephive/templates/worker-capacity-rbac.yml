{{- if not .Values.fullWorkerCanaryOnly }}
{{- with .Values.workerCapacityConfigMapName }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-worker-capacity
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-worker-capacity
  namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-worker-capacity
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-consumer-sa
    namespace: {{ $.Release.Namespace }}
{{- end }}

{{- end }}
