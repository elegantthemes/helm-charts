{{- if and .Release.IsUpgrade (not .Values.sourceReaderService.enabled) }}
{{- $broker := lookup "apps/v1" "Deployment" .Release.Namespace (printf "%s-source-reader" .Release.Name) }}
{{- if and $broker (or (ne (int $broker.spec.replicas) 0) (gt (int ($broker.status.replicas | default 0)) 0)) }}{{ fail "Drain and scale the source reader to zero before removing its protection" }}{{ end }}
{{- range $pod := (lookup "v1" "Pod" .Release.Namespace "").items }}
{{- if or (eq (index ($pod.metadata.labels | default dict) "app") (printf "%s-source-reader" $.Release.Name)) (and (eq (index ($pod.metadata.labels | default dict) "deephive/role") "source-reader") (eq (index ($pod.metadata.labels | default dict) "app.kubernetes.io/instance") $.Release.Name)) }}{{ fail "Reader pods remain; retain reader protection until cleanup completes" }}{{ end }}
{{- end }}
{{- end }}
{{- $f := .Values.fullEnvironment }}
{{- $identity := printf "%s-%s-session-admission" .Release.Namespace .Release.Name }}
{{- $policyName := printf "%s-%s" ($identity | trunc 50 | trimSuffix "-") ((list .Release.Namespace .Release.Name "session-admission") | toJson | sha256sum | trunc 12) }}
{{- if and $f.enabled $f.runnerEnabled }}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $policyName }}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $policyName }}
{{- if or (not $policy) (not $binding) }}{{ fail "Install fullEnvironment with runnerEnabled=false, verify admission, then enable the runner in a second upgrade" }}{{ end }}
{{- if ne ($policy.spec.failurePolicy | default "") "Fail" }}{{ fail "Session admission must fail closed" }}{{ end }}
{{- if or (ne $binding.spec.policyName $policyName) (not (has "Deny" $binding.spec.validationActions)) }}{{ fail "Session admission binding must enforce Deny" }}{{ end }}
{{- if not (hasKey $policy "status") }}{{ fail "Admission type checking has not completed" }}{{ end }}
{{- if ne (int64 ($policy.status.observedGeneration | default 0)) (int64 $policy.metadata.generation) }}{{ fail "Wait for admission policy status to observe the installed generation" }}{{ end }}
{{- if $policy.status.typeChecking.expressionWarnings }}{{ fail "Resolve session admission expression warnings before runner enablement" }}{{ end }}
{{- end }}
{{- if and .Release.IsUpgrade (not $f.enabled) }}
{{- $runner := lookup "apps/v1" "Deployment" .Release.Namespace (printf "%s-runner" .Release.Name) }}
{{- if and $runner (or (ne (int $runner.spec.replicas) 0) (gt (int ($runner.status.replicas | default 0)) 0)) }}{{ fail "Scale the drained runner to zero and wait for its pods to end before removing protections" }}{{ end }}
{{- $pods := lookup "v1" "Pod" .Release.Namespace "" }}
{{- range $pod := $pods.items }}
{{- if eq (index ($pod.metadata.labels | default dict) "app") (printf "%s-runner" $.Release.Name) }}{{ fail "Runner pods remain; wait for their deletion before removing session protections" }}{{ end }}
{{- if and (eq (index ($pod.metadata.labels | default dict) "app.kubernetes.io/name") "deephive-session") (eq (index ($pod.metadata.labels | default dict) "app.kubernetes.io/instance") $.Release.Name) }}{{ fail "Drain and confirm deletion of session pods before disabling fullEnvironment; keep admission, proxy and network protections installed" }}{{ end }}
{{- end }}
{{- end }}
{{- if $f.enabled }}
# Helm uninstall does not re-render templates. A retained read-only pre-delete
# hook checks the live cluster before Helm can remove any session protections.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-session-drain-check
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-session-drain-check
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ printf "%s-runner" .Release.Name | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-session-drain-check
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-session-drain-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-session-drain-check
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-session-drain-check
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-session-drain-check
      imagePullSecrets: [{ name: {{ $f.pullSecret | quote }} }]
      containers:
        - name: check
          image: {{ $f.runnerImage | quote }}
          command: [node, --input-type=module, -e]
          args:
            - |
              import { KubernetesApi } from '/opt/deephive/dist/src/execution/environment/kubernetes.js';
              const api = await KubernetesApi.inCluster();
              const runner = await api.call('GET', '/apis/apps/v1/namespaces/' + {{ .Release.Namespace | toJson }} + '/deployments/' + {{ printf "%s-runner" .Release.Name | toJson }});
              if (runner && (runner.spec.replicas !== 0 || (runner.status.replicas ?? 0) !== 0)) throw new Error('Scale the drained runner to zero and wait before uninstall');
              const selector = 'app.kubernetes.io/name=deephive-session,app.kubernetes.io/instance=' + {{ .Release.Name | toJson }};
              const pods = await api.call('GET', '/api/v1/namespaces/' + {{ .Release.Namespace | toJson }} + '/pods?labelSelector=' + encodeURIComponent(selector));
              const runners = await api.call('GET', '/api/v1/namespaces/' + {{ .Release.Namespace | toJson }} + '/pods?labelSelector=' + encodeURIComponent('app=' + {{ printf "%s-runner" .Release.Name | toJson }}));
              if (!runners || runners.items.length) throw new Error('Runner pods remain; admission may still create sessions');
              if (!pods || pods.items.length) throw new Error('Session drain incomplete; retain admission, proxy and network isolation');
              const reader = await api.call('GET', '/apis/apps/v1/namespaces/' + {{ .Release.Namespace | toJson }} + '/deployments/' + {{ printf "%s-source-reader" .Release.Name | toJson }});
              if (reader && (reader.spec.replicas !== 0 || (reader.status.replicas ?? 0) !== 0)) throw new Error('Drain and scale the source reader to zero before uninstall');
              for (const selector of ['app=' + {{ printf "%s-source-reader" .Release.Name | toJson }}, 'deephive/role=source-reader,app.kubernetes.io/instance=' + {{ .Release.Name | toJson }}]) {
                const remaining = await api.call('GET', '/api/v1/namespaces/' + {{ .Release.Namespace | toJson }} + '/pods?labelSelector=' + encodeURIComponent(selector));
                if (!remaining || remaining.items.length) throw new Error('Reader pods remain; retain source-reader admission');
              }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
{{- end }}
