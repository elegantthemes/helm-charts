{{- $reader := include "deephive.sourceReader" (dict "context" . "codeRoot" "/opt/deephive") | fromJson }}
{{- if .Values.fullWorker.enabled }}
{{- $f := .Values.fullWorker }}
{{- $nodeRole := printf "%s-%s" (printf "%s-%s-full-worker-node" .Release.Namespace .Release.Name | trunc 50 | trimSuffix "-") ((list .Release.Namespace .Release.Name "full-worker-node") | toJson | sha256sum | trunc 12) }}
{{- $prepull := printf "%s-full-session-prepull" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $egress := printf "%s-session-egress" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $f.runnerImage) }}{{ fail "fullWorker.runnerImage must pin a digest" }}{{ end }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $f.sessionImage) }}{{ fail "fullWorker.sessionImage must pin a digest" }}{{ end }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $f.databaseImage) }}{{ fail "fullWorker.databaseImage must pin a digest" }}{{ end }}
{{- if or (eq $f.agentSecret "secrets") (eq ($f.integrationSecret | default "") "secrets") (eq $f.agentSecret $f.runnerSecret) (and $f.integrationSecret (eq $f.integrationSecret $f.runnerSecret)) }}{{ fail "Session credentials must not reference consumer or runner Secrets" }}{{ end }}
{{- if not $f.approvedEgressDomains }}{{ fail "Explicit approved package/model/test domains required" }}{{ end }}
{{- if and $f.observationEnabled (not $f.publicOrigin) }}{{ fail "Exact public observation origin required" }}{{ end }}
{{- if not (has (toJson $f.sessionProtocol) (list "2" "3")) }}{{ fail "Session protocol must be 2 or 3" }}{{ end }}
{{- if and (or $f.routingEnabled $f.taskAllowlist) (ne (int $f.sessionProtocol) 3) }}{{ fail "Phase 3 routing requires session protocol 3" }}{{ end }}
{{- range $image := $f.legacyProtocol2Images }}
{{- if not (has $image (append $f.compatibleSessionImages $f.sessionImage)) }}{{ fail "Legacy protocol 2 images must be retained compatible images" }}{{ end }}
{{- if and (eq $image $f.sessionImage) (ne (int $f.sessionProtocol) 2) }}{{ fail "Current protocol 3 image cannot be a legacy bootstrap exception" }}{{ end }}
{{- end }}
{{- range $image := append $f.compatibleSessionImages $f.sessionImage }}
{{- if and (not (has $image $f.legacyProtocol2Images)) (not (regexMatch "^[a-f0-9]{64}$" (index $f.approvedBootstraps $image | default ""))) }}{{ fail "Every pinned and compatible session image requires its approved bootstrap/runtime identity" }}{{ end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, patch, delete]
---
{{- if or $f.runnerEnabled (lookup "rbac.authorization.k8s.io/v1" "RoleBinding" .Release.Namespace (include "deephive.fullWorkerName" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ (include "deephive.fullWorkerName" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ (include "deephive.fullWorkerName" .) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $nodeRole }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [{{ required "Full worker node required" $f.nodeName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $nodeRole }}
subjects:
  - kind: ServiceAccount
    name: {{ (include "deephive.fullWorkerName" .) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $nodeRole }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}
data:
  runner.json: |
    {{ dict "namespace" .Release.Namespace "release" .Release.Name "nodeName" $f.nodeName "image" $f.sessionImage "databaseImage" $f.databaseImage "imagePullSecret" $f.pullSecret "agentSecret" (required "Session agent Secret required" $f.agentSecret) "integrationSecret" ($f.integrationSecret | default "") "workspaceClaim" $f.workspaceClaim "workspaceRoot" $f.workspaceRoot "scratchRoot" "/node-scratch" "cacheRoot" "/node-cache" "runnerUrl" (printf "http://%s:3001" (include "deephive.fullWorkerName" .)) "proxyUrl" (printf "http://%s:3128" $egress) "pressureCommand" $f.pressureCommand "signingKeyFile" "/runner-secret/signing-key" "controlPort" 3001 "observationPort" (ternary 3002 0 $f.observationEnabled) "observationTokenFile" "/runner-secret/observation-token" "approvedBootstraps" $f.approvedBootstraps "sourceReader" $reader "sessionProtocol" $f.sessionProtocol "draining" $f.draining "validationTimeoutMs" $f.validationTimeoutMs | toJson }}
{{/* The config contains no credentials; signing key is read from runner-only Secret. */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}
spec:
  replicas: {{ ternary 1 0 $f.runnerEnabled }}
  selector:
    matchLabels: { app: {{ (include "deephive.fullWorkerName" .) }} }
  template:
    metadata:
      annotations:
{{- if .Values.sourceReaderService.enabled }}
        source-reader-token-revision: {{ .Values.sourceReaderService.tokenRevision | quote }}
{{- end }}
        checksum/runner-config: {{ toJson $f | sha256sum | quote }}
      labels: { app: {{ (include "deephive.fullWorkerName" .) }}, deephive/worker-mode: full, redis-client: "true" }
    spec:
      nodeName: {{ $f.nodeName | quote }}
      tolerations:
        - { key: deephive-full, operator: Equal, value: "true", effect: NoSchedule }
      serviceAccountName: {{ (include "deephive.fullWorkerName" .) }}
      imagePullSecrets:
        - name: {{ required "Private pull secret required" $f.pullSecret | quote }}
      containers:
        - name: runner
          image: {{ $f.runnerImage | quote }}
          command: [node, /opt/deephive/dist/src/fullWorker.js]
          env:
            - name: FULL_WORKER_CONFIG
              value: /runner-config/runner.json
            - name: FULL_WORKER_ROUTING
              value: {{ ternary "1" "0" $f.routingEnabled | quote }}
            - name: FULL_WORKER_TASK_ALLOWLIST
              value: {{ $f.taskAllowlist | quote }}
            - name: BROWSER_EVIDENCE_BUCKET
              value: {{ $f.evidenceBucket | quote }}
            - name: BROWSER_EVIDENCE_REGION
              value: {{ $f.evidenceRegion | quote }}
            - name: BROWSER_EVIDENCE_ENDPOINT
              value: {{ $f.evidenceEndpoint | quote }}
          envFrom:
            - secretRef: { name: {{ required "Runner-only secret required" $f.runnerSecret | quote }} }
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits: { memory: 1Gi, cpu: "2" }
          ports: [{ name: control, containerPort: 3001 }, { name: observation, containerPort: 3002 }]
          # The listener starts only after configuration, Kubernetes and ledger initialization.
          readinessProbe:
            tcpSocket: { port: control }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
{{- if .Values.sourceReaderService.enabled }}
            - { name: source-reader-token, mountPath: /source-reader-token, readOnly: true }
{{- end }}
            - { name: config, mountPath: /runner-config, readOnly: true }
            - { name: secret, mountPath: /runner-secret, readOnly: true }
            - { name: workspace, mountPath: {{ $f.workspaceRoot | quote }}, mountPropagation: HostToContainer }
            - { name: cache-probe, mountPath: /node-cache, readOnly: true }
            - { name: scratch-probe, mountPath: /node-scratch, readOnly: true }
      volumes:
{{- if .Values.sourceReaderService.enabled }}
        - name: source-reader-token
          secret: { secretName: {{ .Values.sourceReaderService.tokenSecret | quote }}, items: [{ key: token, path: token }] }
{{- end }}
        - name: config
          configMap: { name: {{ (include "deephive.fullWorkerName" .) }} }
        - name: secret
          secret: { secretName: {{ $f.runnerSecret | quote }} }
        - name: workspace
          persistentVolumeClaim: { claimName: {{ required "Workspace claim required" $f.workspaceClaim | quote }} }
        - name: cache-probe
          hostPath: { path: {{ required "Retained CSI cache path required" $f.cacheProbePath | quote }}, type: Directory }
        - name: scratch-probe
          hostPath: { path: {{ required "Dedicated DeepHive scratch probe directory required" $f.scratchProbePath | quote }}, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}
spec:
  selector: { app: {{ (include "deephive.fullWorkerName" .) }} }
  ports: [{ name: control, port: 3001, targetPort: control }, { name: observation, port: 3002, targetPort: observation }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sessions
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: deephive-session, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  policyTypes: [Ingress, Egress]
{{- if $f.observationEnabled }}
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: {{ (include "deephive.fullWorkerName" .) }} }
      ports: [{ protocol: TCP, port: 5901 }]
{{- else }}
  ingress: []
{{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - podSelector:
            matchLabels: { app: {{ (include "deephive.fullWorkerName" .) }} }
      ports: [{ protocol: TCP, port: 3001 }]
    - to:
        - podSelector:
            matchLabels: { app: {{ $egress }} }
      ports: [{ protocol: TCP, port: 3128 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ (include "deephive.fullWorkerName" .) }}-control
spec:
  podSelector:
    matchLabels: { app: {{ (include "deephive.fullWorkerName" .) }} }
  policyTypes: [Ingress]
  ingress:
{{- if $f.observationEnabled }}
    - from:
        - podSelector:
            matchLabels: { app: {{ .Release.Name }} }
      ports: [{ protocol: TCP, port: 3002 }]
{{- end }}
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: deephive-session, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
      ports: [{ protocol: TCP, port: 3001 }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $prepull }}
spec:
  selector:
    matchLabels: { app: {{ $prepull }} }
  template:
    metadata:
      labels: { app: {{ $prepull }} }
    spec:
      tolerations:
        - { key: deephive-full, operator: Equal, value: "true", effect: NoSchedule }
      {{- with $f.prepullTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: [{{ $f.nodeName | quote }}]
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: {{ $f.pullSecret | quote }} }]
      containers:
        - name: cache
          image: {{ $f.sessionImage | quote }}
          command: [sleep, infinity]
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 32Mi, cpu: 100m }
{{- end }}
