apiVersion: v1
kind: Secret
metadata:
  name: secrets
  namespace: {{ .Release.Namespace }}
stringData:
{{- if .Values.MYSQL_ENABLED }}
  MYSQL_PASSWORD: {{ .Values.MYSQL_PASSWORD | default "" | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.MYSQL_ROOT_PASSWORD | default "" | quote }}
{{- end }}
  GITHUB_TOKEN: {{ .Values.GITHUB_TOKEN | squote }}
  .env: |-
{{- required "ENV_FILE is required" .Values.ENV_FILE | nindent 4 }}
