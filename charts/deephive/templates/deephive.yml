{{- $ordinary := include "deephive.ordinaryCommands" . | fromJson }}
{{- $reader := include "deephive.sourceReader" (dict "context" . "codeRoot" (default "/srv/deephive" .Values.INSTALL_PATH)) | fromJson }}
{{- if and (or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist .Values.fullEnvironment.observationEnabled) (not .Values.fullEnvironment.enabled) }}{{ fail "Routing or observation requires fullEnvironment.enabled" }}{{ end }}
{{- if and (or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist) (or (not .Values.fullEnvironment.sourceSeedPath) (not (hasPrefix "/" .Values.fullEnvironment.sourceSeedPath)) (not $ordinary.admit) (not $ordinary.release) (not (hasPrefix "/" .Values.fullEnvironment.ordinaryScratchRoot)) (not $reader.command) (not ($reader.readerId | trim)) (not .Values.fullEnvironment.evidenceBucket) (not .Values.fullEnvironment.publicOrigin)) }}{{ fail "Routing requires source seed, fresh reader, private evidence bucket and stable origin" }}{{ end }}
{{- if or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist }}
{{- range $command := list $reader.command $ordinary.admit $ordinary.release .Values.fullEnvironment.ordinaryInstallCommand }}
{{- if and $command (not (hasPrefix "/" (index $command 0))) }}{{ fail "Source reader and ordinary-worker fencing commands must use absolute executable paths" }}{{ end }}
{{- end }}
{{- end }}
{{- if and .Values.fullEnvironment.evidenceBucket (not .Values.fullEnvironment.evidenceRegion) }}{{ fail "Private evidence bucket requires its region" }}{{ end }}
{{- if or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist .Values.fullEnvironment.observationEnabled .Values.fullEnvironment.evidenceBucket }}
{{- if not (regexMatch "^https://([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)*[a-z]([a-z0-9-]{0,61}[a-z0-9])?(:[1-9][0-9]{0,4})?$" .Values.fullEnvironment.publicOrigin) }}{{ fail "Stable public origin must be an exact HTTPS origin using a lowercase DNS host without userinfo, path, query or fragment" }}{{ end }}
{{- $port := trimPrefix ":" (regexFind ":[0-9]+$" .Values.fullEnvironment.publicOrigin) }}
{{- if and $port (or (gt (int $port) 65535) (eq (int $port) 443)) }}{{ fail "Public origin port must be at most 65535; omit the default HTTPS port 443" }}{{ end }}
{{- end }}
{{- if or .Values.fullEnvironment.observationEnabled .Values.fullEnvironment.evidenceBucket }}
{{- $host := regexReplaceAll ":[0-9]+$" (trimPrefix "https://" .Values.fullEnvironment.publicOrigin) "" }}
{{- if ne $host .Values.VIRTUAL_HOST }}{{ fail "Public origin hostname must match the configured ingress VIRTUAL_HOST" }}{{ end }}
{{- end }}
{{- if and .Values.fullEnvironment.evidenceBucket (has .Values.fullEnvironment.evidenceReadSecret (list "secrets" .Values.fullEnvironment.runnerSecret .Values.fullEnvironment.agentSecret (.Values.fullEnvironment.integrationSecret | default ""))) }}{{ fail "Evidence requires a dedicated read-only Secret separate from runner, agent and consumer credentials" }}{{ end }}
{{- if or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist }}
{{- if not (has "ReadWriteMany" .Values.WORKSPACE_ACCESS_MODES) }}{{ fail "Routing requires a ReadWriteMany shared workspace claim" }}{{ end }}
{{- if or (not (hasPrefix "/" .Values.fullEnvironment.ordinaryCacheProbePath)) (eq .Values.fullEnvironment.ordinaryCacheProbePath "/") }}{{ fail "Routing requires an actual ordinary-worker retained-cache probe directory" }}{{ end }}
{{- $scratch := .Values.fullEnvironment.ordinaryScratchRoot }}
{{- $source := .Values.fullEnvironment.workspaceRoot }}
{{- if or (eq $scratch "/") (ne (clean $scratch) $scratch) (eq $scratch $source) (hasPrefix (printf "%s/" $source) $scratch) (hasPrefix (printf "%s/" $scratch) $source) }}{{ fail "Ordinary scratch must be canonical and disjoint from the shared candidate source workspace" }}{{ end }}
{{- end }}
{{- $workspaceClaim := default (printf "%s-workspace" .Release.Name) .Values.WORKSPACE_CLAIM_NAME -}}
{{- if and (or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist) (or (ne $workspaceClaim .Values.fullEnvironment.workspaceClaim) (ne .Values.WORKSPACE_ROOT .Values.fullEnvironment.workspaceRoot) (not (hasPrefix "/" .Values.fullEnvironment.workspaceRoot))) }}{{ fail "Routing requires consumer and runner to share the same workspace claim and absolute canonical workspace root" }}{{ end }}
{{- if and (or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist) (or (ne (clean .Values.fullEnvironment.sourceSeedPath) .Values.fullEnvironment.sourceSeedPath) (ne (clean .Values.fullEnvironment.workspaceRoot) .Values.fullEnvironment.workspaceRoot) (not (hasPrefix (printf "%s/" .Values.fullEnvironment.workspaceRoot) .Values.fullEnvironment.sourceSeedPath))) }}{{ fail "Routing source seed must be a canonical descendant of the shared workspace root" }}{{ end }}
{{- if or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist }}
{{- if not .Values.fullEnvironment.runnerEnabled }}{{ fail "Routing requires runnerEnabled=true after protection installation" }}{{ end }}
{{- if and .Values.sourceReaderService.enabled (not .Values.sourceReaderService.running) }}{{ fail "Routing requires the managed source reader running=true" }}{{ end }}
{{- end }}
{{- if and .Values.LEGACY_WORKSPACE_RETAIN (eq $workspaceClaim (printf "%s-workspace" .Release.Name)) -}}
{{- fail "LEGACY_WORKSPACE_RETAIN requires a different WORKSPACE_CLAIM_NAME" -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-intake
  ports:
    - port: {{ .Values.PORT }}
      targetPort: {{ .Values.PORT }}
      name: nodejs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-consumer
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-consumer
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.PORT }}
      targetPort: {{ .Values.PORT }}
      name: nodejs
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $workspaceClaim }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.fullEnvironment.writebackEnabled }}
  labels:
    deephive.elegantthemes.com/writeback: enabled
{{- end }}
spec:
  accessModes:
{{ toYaml .Values.WORKSPACE_ACCESS_MODES | indent 4 }}
  resources:
    requests:
      storage: {{ .Values.WORKSPACE_STORAGE_SIZE | squote }}
  storageClassName: {{ .Values.WORKSPACE_STORAGE_CLASS_NAME | squote }}
---
{{ if .Values.LEGACY_WORKSPACE_RETAIN }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-workspace
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.LEGACY_WORKSPACE_STORAGE_SIZE | squote }}
  storageClassName: {{ .Values.LEGACY_WORKSPACE_STORAGE_CLASS_NAME | squote }}
---
{{ end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.REPLICAS }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/ordinary-capacity: {{ toJson .Values.fullEnvironment.ordinaryCapacity | sha256sum | quote }}
{{- if .Values.sourceReaderService.enabled }}
        source-reader-token-revision: {{ .Values.sourceReaderService.tokenRevision | quote }}
{{- end }}
{{- if .Values.fullEnvironment.observationEnabled }}
        observation-secret-revision: {{ required "Runner Secret revision required with observation; increment it after token rotation" .Values.fullEnvironment.runnerSecretRevision | quote }}
{{- end }}
{{- if .Values.fullEnvironment.evidenceBucket }}
        evidence-secret-revision: {{ required "Evidence read Secret revision required; increment it after credential rotation" .Values.fullEnvironment.evidenceReadSecretRevision | quote }}
{{- end }}
        checksum/env-file: {{ required "ENV_FILE is required" .Values.ENV_FILE | sha256sum | quote }}
{{- if .Values.MYSQL_ENABLED }}
        checksum/mysql-credentials: {{ list .Values.MYSQL_PASSWORD .Values.MYSQL_ROOT_PASSWORD | toJson | sha256sum | quote }}
{{- end }}
      labels:
        app: {{ .Release.Name }}
        deephive/role: consumer
        redis-client: 'true'
    spec:
{{- if .Values.CODEX_AUTH_SECRET_NAME }}
      # Lets DeepHive read/update the Codex login Secret (see codex-auth.yml).
      serviceAccountName: {{ .Release.Name }}-consumer-sa
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.CONSUMER_TERMINATION_GRACE_SECONDS | default 120 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Release.Name }}
              namespaces:
                - {{ .Release.Namespace }}
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cloud-screenshot
              namespaces:
                - dc-screenshot
              topologyKey: kubernetes.io/hostname
{{- if .Values.NODE_SELECTOR_HOSTNAME }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.NODE_SELECTOR_HOSTNAME | squote }}
{{- end }}
      containers:
        - name: {{ .Release.Name }}
          env:
            - name: WORKSPACE_COPY_METHOD
              value: {{ .Values.WORKSPACE_COPY_METHOD | default "fs.cp" | quote }}
{{- if or .Values.fullEnvironment.routingEnabled .Values.fullEnvironment.taskAllowlist }}
            - name: WORKSPACE_ROOT
              value: {{ .Values.WORKSPACE_ROOT | quote }}
{{- end }}
            - name: FULL_ENVIRONMENT_ROUTING
              value: {{ ternary "1" "0" .Values.fullEnvironment.routingEnabled | quote }}
            - name: FULL_ENVIRONMENT_TASK_ALLOWLIST
              value: {{ .Values.fullEnvironment.taskAllowlist | quote }}
            - name: FULL_ENVIRONMENT_SOURCE_SEED
              value: {{ .Values.fullEnvironment.sourceSeedPath | quote }}
            - name: FULL_ENVIRONMENT_ORDINARY_ADMISSION_COMMAND
              value: {{ toJson $ordinary.admit | quote }}
            - name: FULL_ENVIRONMENT_ORDINARY_INSTALL_COMMAND
              value: {{ toJson .Values.fullEnvironment.ordinaryInstallCommand | quote }}
            - name: FULL_ENVIRONMENT_LEGACY_RECOVERY_COMMAND
              value: {{ toJson .Values.fullEnvironment.legacyRecoveryCommand | quote }}
            - name: FULL_ENVIRONMENT_ORDINARY_HANDOFF_COMMAND
              value: {{ toJson $ordinary.release | quote }}
            - name: FULL_ENVIRONMENT_ORDINARY_SCRATCH_ROOT
              value: {{ .Values.fullEnvironment.ordinaryScratchRoot | quote }}
            - name: FULL_ENVIRONMENT_ORDINARY_CACHE_ROOT
              value: {{ ternary "/ordinary-cache-probe" "" (not (empty .Values.fullEnvironment.ordinaryCacheProbePath)) | quote }}
            - name: FULL_ENVIRONMENT_READER_CONFIG
              value: {{ toJson $reader | quote }}
{{- if or .Values.fullEnvironment.observationEnabled .Values.fullEnvironment.evidenceBucket }}
            - name: BROWSER_PUBLIC_ORIGIN
              value: {{ required "Stable HTTPS origin required" .Values.fullEnvironment.publicOrigin | quote }}
{{- end }}
{{- if .Values.fullEnvironment.observationEnabled }}
            - name: BROWSER_OBSERVATION_RUNNER_URL
              value: {{ printf "http://%s-runner:3002" .Release.Name | quote }}
            - name: BROWSER_OBSERVATION_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.fullEnvironment.runnerSecret | quote }}, key: observation-token }
{{- end }}
{{- if .Values.fullEnvironment.evidenceBucket }}
            - name: BROWSER_EVIDENCE_BUCKET
              value: {{ .Values.fullEnvironment.evidenceBucket | quote }}
            - name: BROWSER_EVIDENCE_REGION
              value: {{ .Values.fullEnvironment.evidenceRegion | quote }}
            - name: BROWSER_EVIDENCE_ENDPOINT
              value: {{ .Values.fullEnvironment.evidenceEndpoint | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ required "Evidence read-only Secret required" .Values.fullEnvironment.evidenceReadSecret | quote }}, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.fullEnvironment.evidenceReadSecret | quote }}, key: AWS_SECRET_ACCESS_KEY }
{{- end }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEEPHIVE_PATH
              value: {{ .Values.INSTALL_PATH | squote }}
            - name: VIRTUAL_HOST
              value: {{ .Values.VIRTUAL_HOST | squote }}
            - name: DEEPHIVE_REPO_URL
              value: {{ .Values.DEEPHIVE_REPO_URL | squote }}
            - name: IMAGE_VERSION
              value: {{ .Values.DEEPHIVE_VERSION | squote }}
            - name: GIT_REF
              value: {{ .Values.GIT_REF | squote }}
            - name: DEEPHIVE_ROLE
              value: consumer
            - name: S6_SERVICES_GRACETIME
              value: '110000'
            - name: S6_KILL_GRACETIME
              value: '5000'
            - name: WORKER_SHUTDOWN_DEADLINE_MS
              value: '90000'

          image: {{ .Values.DEEPHIVE_IMAGE | squote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.PORT }}
              scheme: HTTP
            periodSeconds: 30
          ports:
            - name: nodejs
              containerPort: {{ .Values.PORT }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.PORT }}
              scheme: HTTP
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: '2'
              memory: {{ .Values.MEMORY_LIMIT | squote }}
          startupProbe:
            exec:
              command:
                - cat
                - {{ .Values.INSTALL_PATH }}/dist/healthz
            initialDelaySeconds: 60
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
{{- if .Values.fullEnvironment.ordinaryCapacity.enabled }}
            - name: ordinary-config
              mountPath: /ordinary-config
              readOnly: true
            - name: ordinary-scratch
              mountPath: {{ .Values.fullEnvironment.ordinaryScratchRoot | quote }}
{{- end }}
{{- if .Values.sourceReaderService.enabled }}
            - { name: source-reader-token, mountPath: /source-reader-token, readOnly: true }
{{- end }}
{{- if .Values.fullEnvironment.ordinaryCacheProbePath }}
            - name: ordinary-cache-probe
              mountPath: /ordinary-cache-probe
              readOnly: true
{{- end }}
            - name: wordpress
              mountPath: /srv
            - name: workspace
              mountPropagation: HostToContainer
              mountPath: {{ .Values.WORKSPACE_ROOT | squote }}
            - name: config
              mountPath: /config
              readOnly: true
{{- if .Values.MYSQL_ENABLED }}
        - name: mysql
          image: {{ .Values.MYSQL_IMAGE | squote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.MYSQL_DATABASE | squote }}
            - name: MYSQL_USER
              value: {{ .Values.MYSQL_USER | squote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: secrets, key: MYSQL_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: secrets, key: MYSQL_ROOT_PASSWORD }
          ports:
            - name: mysql
              containerPort: {{ .Values.MYSQL_PORT }}
          # Give MySQL a bit of room but keep it bounded.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
{{- end }}

      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
      volumes:
{{- if .Values.fullEnvironment.ordinaryCapacity.enabled }}
        - name: ordinary-config
          configMap: { name: {{ .Release.Name }}-ordinary-capacity }
        - name: ordinary-scratch
          emptyDir: { sizeLimit: {{ .Values.fullEnvironment.ordinaryCapacity.scratchSize | quote }} }
{{- end }}
{{- if .Values.sourceReaderService.enabled }}
        - name: source-reader-token
          secret: { secretName: {{ .Values.sourceReaderService.tokenSecret | quote }}, items: [{ key: token, path: token }] }
{{- end }}
{{- if .Values.fullEnvironment.ordinaryCacheProbePath }}
        - name: ordinary-cache-probe
          hostPath: { path: {{ .Values.fullEnvironment.ordinaryCacheProbePath | quote }}, type: Directory }
{{- end }}
        - name: wordpress
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ $workspaceClaim }}
        - name: config
          secret:
            secretName: secrets
{{- if .Values.MYSQL_ENABLED }}
        - name: mysql-data
          emptyDir: {}
{{- end }}
