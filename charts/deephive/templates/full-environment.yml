{{- if .Values.fullEnvironment.enabled }}
{{- $f := .Values.fullEnvironment }}
{{- $nodeRole := printf "%s-%s" (printf "%s-%s-execution-node" .Release.Namespace .Release.Name | trunc 50 | trimSuffix "-") ((list .Release.Namespace .Release.Name "execution-node") | toJson | sha256sum | trunc 12) }}
{{- $prepull := printf "%s-session-prepull" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $egress := printf "%s-session-egress" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $f.runnerImage) }}{{ fail "fullEnvironment.runnerImage must pin a digest" }}{{ end }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $f.sessionImage) }}{{ fail "fullEnvironment.sessionImage must pin a digest" }}{{ end }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $f.databaseImage) }}{{ fail "fullEnvironment.databaseImage must pin a digest" }}{{ end }}
{{- if or (eq $f.agentSecret "secrets") (eq ($f.integrationSecret | default "") "secrets") (eq $f.agentSecret $f.runnerSecret) (and $f.integrationSecret (eq $f.integrationSecret $f.runnerSecret)) }}{{ fail "Session credentials must not reference consumer or runner Secrets" }}{{ end }}
{{- if not $f.pressureCommand }}{{ fail "Node-wide active-writer pressure fencing must be configured" }}{{ end }}
{{- if not $f.approvedEgressDomains }}{{ fail "Explicit approved package/model/test domains required" }}{{ end }}
{{- if and $f.observationEnabled (not $f.publicOrigin) }}{{ fail "Exact public observation origin required" }}{{ end }}
{{- if not (has (int $f.sessionProtocol) (list 2 3)) }}{{ fail "Session protocol must be 2 or 3" }}{{ end }}
{{- if and (or $f.routingEnabled $f.taskAllowlist) (ne (int $f.sessionProtocol) 3) }}{{ fail "Phase 3 routing requires session protocol 3" }}{{ end }}
{{- if not (index $f.approvedBootstraps $f.sessionImage) }}{{ fail "Pinned session image requires its approved bootstrap/runtime identity" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-runner
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $nodeRole }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [{{ required "Execution node required" $f.nodeName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $nodeRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-runner
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $nodeRole }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runner
data:
  runner.json: |
    {{ dict "namespace" .Release.Namespace "release" .Release.Name "nodeName" $f.nodeName "image" $f.sessionImage "databaseImage" $f.databaseImage "imagePullSecret" $f.pullSecret "agentSecret" (required "Session agent Secret required" $f.agentSecret) "integrationSecret" ($f.integrationSecret | default "") "workspaceClaim" $f.workspaceClaim "workspaceRoot" $f.workspaceRoot "scratchRoot" "/node-scratch" "cacheRoot" "/node-cache" "runnerUrl" (printf "http://%s-runner:3001" .Release.Name) "proxyUrl" (printf "http://%s:3128" $egress) "pressureCommand" $f.pressureCommand "signingKeyFile" "/runner-secret/signing-key" "controlPort" 3001 "observationPort" (ternary 3002 0 $f.observationEnabled) "observationTokenFile" "/runner-secret/observation-token" "approvedBootstraps" $f.approvedBootstraps "sourceReader" $f.sourceReader "sessionProtocol" $f.sessionProtocol | toJson }}
{{/* The config contains no credentials; signing key is read from runner-only Secret. */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-runner }
  template:
    metadata:
      annotations:
        checksum/runner-config: {{ toJson $f | sha256sum | quote }}
      labels: { app: {{ .Release.Name }}-runner, redis-client: "true" }
    spec:
      nodeName: {{ $f.nodeName | quote }}
      serviceAccountName: {{ .Release.Name }}-runner
      imagePullSecrets:
        - name: {{ required "Private pull secret required" $f.pullSecret | quote }}
      containers:
        - name: runner
          image: {{ $f.runnerImage | quote }}
          command: [node, /opt/deephive/dist/src/runner.js]
          env:
            - name: FULL_ENVIRONMENT_CONFIG
              value: /runner-config/runner.json
            - name: FULL_ENVIRONMENT_ROUTING
              value: {{ ternary "1" "0" $f.routingEnabled | quote }}
            - name: FULL_ENVIRONMENT_TASK_ALLOWLIST
              value: {{ $f.taskAllowlist | quote }}
            - name: BROWSER_EVIDENCE_BUCKET
              value: {{ $f.evidenceBucket | quote }}
            - name: BROWSER_EVIDENCE_REGION
              value: {{ $f.evidenceRegion | quote }}
            - name: BROWSER_EVIDENCE_ENDPOINT
              value: {{ $f.evidenceEndpoint | quote }}
          envFrom:
            - secretRef: { name: {{ required "Runner-only secret required" $f.runnerSecret | quote }} }
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits: { memory: 1Gi, cpu: "2" }
          ports: [{ name: control, containerPort: 3001 }, { name: observation, containerPort: 3002 }]
          # The listener starts only after configuration, Kubernetes and ledger initialization.
          readinessProbe:
            tcpSocket: { port: control }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - { name: config, mountPath: /runner-config, readOnly: true }
            - { name: secret, mountPath: /runner-secret, readOnly: true }
            - { name: workspace, mountPath: {{ $f.workspaceRoot | quote }} }
            - { name: cache-probe, mountPath: /node-cache, readOnly: true }
            - { name: scratch-probe, mountPath: /node-scratch, readOnly: true }
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-runner }
        - name: secret
          secret: { secretName: {{ $f.runnerSecret | quote }} }
        - name: workspace
          persistentVolumeClaim: { claimName: {{ required "Workspace claim required" $f.workspaceClaim | quote }} }
        - name: cache-probe
          hostPath: { path: {{ required "Retained CSI cache path required" $f.cacheProbePath | quote }}, type: Directory }
        - name: scratch-probe
          hostPath: { path: {{ required "Dedicated DeepHive scratch probe directory required" $f.scratchProbePath | quote }}, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-runner
spec:
  selector: { app: {{ .Release.Name }}-runner }
  ports: [{ name: control, port: 3001, targetPort: control }, { name: observation, port: 3002, targetPort: observation }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sessions
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: deephive-session, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: {{ .Release.Name }}-runner }
      ports: [{ protocol: TCP, port: 5901 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - podSelector:
            matchLabels: { app: {{ .Release.Name }}-runner }
      ports: [{ protocol: TCP, port: 3001 }]
    - to:
        - podSelector:
            matchLabels: { app: {{ $egress }} }
      ports: [{ protocol: TCP, port: 3128 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-runner-control
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-runner }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: {{ .Release.Name }} }
      ports: [{ protocol: TCP, port: 3002 }]
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: deephive-session, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
      ports: [{ protocol: TCP, port: 3001 }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $prepull }}
spec:
  selector:
    matchLabels: { app: {{ $prepull }} }
  template:
    metadata:
      labels: { app: {{ $prepull }} }
    spec:
      {{- with $f.prepullTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: [{{ $f.nodeName | quote }}]
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: {{ $f.pullSecret | quote }} }]
      containers:
        - name: cache
          image: {{ $f.sessionImage | quote }}
          command: [sleep, infinity]
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 32Mi, cpu: 100m }
{{- end }}
