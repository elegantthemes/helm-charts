DEEPHIVE_IMAGE:
DEEPHIVE_REPO_URL:
DEEPHIVE_VERSION:
ENV_FILE:
GITHUB_TOKEN:
GIT_REF:
INGRESS_CLASS_NAME: traefik
INSTALL_PATH:
MEMORY_LIMIT:
NODE_SELECTOR_HOSTNAME:
PORT: 3000
REPLICAS:
VIRTUAL_HOST:
WORKSPACE_ROOT:
WORKSPACE_ACCESS_MODES:
  - ReadWriteOnce
WORKSPACE_CLAIM_NAME:
WORKSPACE_STORAGE_CLASS_NAME: linode-block-storage
WORKSPACE_STORAGE_SIZE: 250Gi

# Optional: name of an existing Secret (created by Terraform, not by this chart) that holds the
# Codex CLI ChatGPT login (auth.json). When set the chart adds a ServiceAccount for the consumer
# pod and a Role allowing get/patch on only that Secret. The chart never renders the Secret, so
# upgrades and rollbacks cannot overwrite refreshed tokens. Set the same name as
# CODEX_AUTH_SECRET_NAME in the DeepHive env file. Empty = disabled.
CODEX_AUTH_SECRET_NAME: ""
# Image pull Secrets to attach to that ServiceAccount (the consumer stops using `default`,
# so a pull secret attached only to `default` would no longer apply).
CODEX_AUTH_IMAGE_PULL_SECRETS: []

# Preserve the original workspace PVC during a cutover to a different claim.
LEGACY_WORKSPACE_RETAIN: false
LEGACY_WORKSPACE_STORAGE_CLASS_NAME: linode-block-storage
LEGACY_WORKSPACE_STORAGE_SIZE: 250Gi

# Intake Deployment (DeepHive#164). Ingress / → intake Service.
INTAKE_REPLICAS: 2
INTAKE_MEMORY_LIMIT: 2Gi
INTAKE_TERMINATION_GRACE_SECONDS: 30
CONSUMER_TERMINATION_GRACE_SECONDS: 120

# Optional MySQL sidecar (ephemeral) for running PHP tests that require MySQL.
# When enabled, a mysql container runs in the same Pod as deephive and stores data on an emptyDir volume.
MYSQL_ENABLED: false
MYSQL_IMAGE: mysql:8.0
MYSQL_PORT: 3306
MYSQL_DATABASE: deephive
MYSQL_USER: deephive
MYSQL_PASSWORD:
MYSQL_ROOT_PASSWORD:

# App-facing DB connection settings (defaults assume MYSQL_ENABLED sidecar).
DB_HOST: 127.0.0.1
DB_PORT: "3306"
DB_DATABASE: deephive
DB_USERNAME: deephive
DB_PASSWORD:

# Phase 2 preparation only. Routing and workload creation remain disabled.
fullEnvironment:
  enabled: false
  observationEnabled: false
  routingEnabled: false
  taskAllowlist: "" # comma-separated explicit staging issue numbers
  sourceSeedPath: "" # trusted credential-free /opt/divi-seed export on the shared PVC
  legacyProtocol2Images: [] # explicit drain-only exceptions; never permits protocol 3 validation
  approvedBootstraps: {} # immutable session digest -> bootstrap/runtime identity
  sessionProtocol: 3
  ordinaryAdmissionCommand: [] # trusted command reserves existing ordinary worker capacity
  ordinaryInstallCommand: [] # audited isolated installer; no consumer credentials or worker mounts
  ordinaryHandoffCommand: [] # proves task source writers stopped and reservation released
  ordinaryScratchRoot: "" # outside candidate source
  sourceReader:
    readerId: "" # fresh CSI mount/cache identity, never the writer's staging cache
    command: [] # trusted executable returns a complete SourceManifest as JSON
  publicOrigin: "" # https://<DeepHive host>, exact browser Origin
  evidenceBucket: "" # dedicated private bucket provisioned in Phase 4
  evidenceRegion: ""
  evidenceEndpoint: "" # optional S3-compatible service endpoint
  evidenceReadSecret: "" # read-only AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  evidenceReadSecretRevision: "" # required with evidence; increment and upgrade on credential rotation
  nodeName: ""
  runnerImage: "" # immutable ghcr.io/...@sha256:...
  sessionImage: ""
  compatibleSessionImages: [] # prior approved digests needed during compatible runner upgrades
  databaseImage: ""
  proxyImage: "" # approved Squid image, pinned digest
  pullSecret: ""
  agentSecret: "" # OPENAI_API_KEY only; never the consumer Secret
  integrationSecret: "" # optional ET_USERNAME, ET_API_KEY, ET_PASSWORD, GITHUB_TOKEN
  runnerSecret: "" # Redis, signing key, scoped source-publication credentials
  # Increment on in-place Secret rotation and upgrade Helm to roll envFrom credentials.
  # Alternatively: kubectl rollout restart deployment/<release>-runner
  runnerSecretRevision: ""
  prepullTolerations: [] # match the dedicated execution node's NoSchedule taints
  workspaceClaim: ""
  workspaceRoot: /workspace-root # must match enrolled canonical paths
  scratchProbePath: "" # dedicated DeepHive scratch directory on the kubelet filesystem
  cacheProbePath: "" # retained JuiceFS staging/cache filesystem; must be real node path
  approvedEgressDomains: []
  # Infrastructure-supplied trusted command fences ordinary AND full writers.
  pressureCommand: []
