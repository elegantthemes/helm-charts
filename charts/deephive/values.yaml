DEEPHIVE_IMAGE:
DEEPHIVE_REPO_URL:
DEEPHIVE_VERSION:
ENV_FILE:
GITHUB_TOKEN:
GIT_REF:
INGRESS_CLASS_NAME: traefik
INSTALL_PATH:
MEMORY_LIMIT:
NODE_SELECTOR_HOSTNAME:
PORT: 3000
REPLICAS:
VIRTUAL_HOST:
WORKSPACE_ROOT:
WORKSPACE_STORAGE_CLASS_NAME: linode-block-storage
WORKSPACE_STORAGE_SIZE: 250Gi

# Intake vs consumer (DeepHive#164). Always-on: intake Deployment + Ingress /
# → intake Service. Chart 1.2.0 is this shape; first apply has a Slack/Discord
# hole until intake pods are Ready. After that, intake rolls with no hole.
INTAKE_REPLICAS: 2
INTAKE_MEMORY_LIMIT: 1Gi
INTAKE_TERMINATION_GRACE_SECONDS: 60
CONSUMER_TERMINATION_GRACE_SECONDS: 1800

# Optional MySQL sidecar (ephemeral) for running PHP tests that require MySQL.
# When enabled, a mysql container runs in the same Pod as deephive and stores data on an emptyDir volume.
MYSQL_ENABLED: false
MYSQL_IMAGE: mysql:8.0
MYSQL_PORT: 3306
MYSQL_DATABASE: deephive
MYSQL_USER: deephive
MYSQL_PASSWORD:
MYSQL_ROOT_PASSWORD:

# App-facing DB connection settings (defaults assume MYSQL_ENABLED sidecar).
DB_HOST: 127.0.0.1
DB_PORT: "3306"
DB_DATABASE: deephive
DB_USERNAME: deephive
DB_PASSWORD:
