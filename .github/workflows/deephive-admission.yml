name: DeepHive admission tests

on:
  pull_request:
    paths:
      - 'charts/deephive/**'
      - 'tests/deephive-admission/**'
      - 'operations/deephive/**'
      - '.github/workflows/deephive-admission.yml'

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test operations/deephive/queue-window.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 operations/deephive/render.test.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/deephive-admission/go.mod
          cache-dependency-path: tests/deephive-admission/go.sum
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 tests/deephive-admission/run.py
