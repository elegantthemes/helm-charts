name: DeepHive Codex sandbox profile
on:
  pull_request:
    paths:
      - charts/deephive/**
      - tests/deephive-codex-sandbox.py
      - tests/deephive-rollout-pod-proof.py
      - tests/deephive-admission/values.json
      - .github/workflows/deephive-codex-sandbox.yml
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 tests/deephive-codex-sandbox.py
      - run: python3 tests/deephive-rollout-pod-proof.py
